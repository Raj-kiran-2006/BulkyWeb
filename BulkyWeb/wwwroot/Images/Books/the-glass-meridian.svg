      <stop stop-color="#172846"/>
      <stop offset=".62" stop-color="#477d91"/>
      <stop offset="1" stop-color="#e3a776"/>
    </linearGradient>
    <linearGradient id="glass" x2="1" y2="1">
      <stop stop-color="#d9f4ed" stop-opacity=".85"/>
      <stop offset="1" stop-color="#77b8bd" stop-opacity=".18"/>
    </linearGradient>
  </defs>
  <rect width="480" height="720" fill="url(#sky)"/>
  <circle cx="240" cy="275" r="118" fill="none" stroke="#d9edf0" stroke-opacity=".38" stroke-width="2"/>
